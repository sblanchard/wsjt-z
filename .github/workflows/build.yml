name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_COMMON_FLAGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DWSJT_GENERATE_DOCS=OFF
    -DWSJT_SKIP_MANPAGES=ON

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake file dpkg-dev \
            qtbase5-dev qtmultimedia5-dev libqt5serialport5-dev \
            qttools5-dev qttools5-dev-tools libqt5websockets5-dev \
            libqt5sql5-sqlite \
            libfftw3-dev libboost-log-dev libhamlib-dev libhamlib-utils \
            libusb-1.0-0-dev libudev-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            ${CMAKE_COMMON_FLAGS} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v4
        with:
          name: wsjt-z-linux-deb
          path: build/*.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install qt@5 boost fftw hamlib libusb gcc pkgconf

      - name: Select Fortran compiler
        run: |
          fc="$(brew --prefix)/bin/gfortran"
          if [ ! -x "$fc" ]; then
            fc="$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -1)"
          fi
          echo "FC=$fc" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            ${CMAKE_COMMON_FLAGS} \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)" \
            -DCMAKE_Fortran_COMPILER="$FC"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package
        run: cd build && cpack -G DragNDrop

      - uses: actions/upload-artifact@v4
        with:
          name: wsjt-z-macos-dmg
          path: build/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            make
            curl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-portaudio
            mingw-w64-x86_64-nsis

      # MSYS2 has no hamlib package; build it once, cache the install
      # tree as a tarball, and unpack it into /mingw64 every run so
      # pkg-config and fixup_bundle find it with no path juggling.
      - name: Restore Hamlib cache
        id: hamlib-cache
        uses: actions/cache@v4
        with:
          path: hamlib-mingw64.tar
          key: hamlib-4.6.5-mingw64-v1

      - name: Build Hamlib
        if: steps.hamlib-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o hamlib.tar.gz \
            https://github.com/Hamlib/Hamlib/releases/download/4.6.5/hamlib-4.6.5.tar.gz
          tar xf hamlib.tar.gz
          cd hamlib-4.6.5
          ./configure --prefix=/mingw64 --enable-shared --disable-static \
            --without-readline
          make -j"$(nproc)"
          make install DESTDIR="$(pwd)/staging"
          tar -C staging/mingw64 -cf ../hamlib-mingw64.tar .

      - name: Install Hamlib
        run: tar -xf hamlib-mingw64.tar -C /mingw64

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja ${CMAKE_COMMON_FLAGS}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cd build && cpack -G NSIS

      - uses: actions/upload-artifact@v4
        with:
          name: wsjt-z-windows-installer
          path: build/*.exe
          if-no-files-found: error

  release:
    name: Attach installers to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/*.exe
          generate_release_notes: true
